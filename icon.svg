<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111b31"/>
      <stop offset="100%" stop-color="#090f1e"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi e-sport -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Cercles concentriques Blason WA stylisés -->
  <circle cx="256" cy="235" r="170" fill="none" stroke="#3b82f6" stroke-width="12" opacity="0.8"/>
  <circle cx="256" cy="235" r="125" fill="none" stroke="#ef4444" stroke-width="14" opacity="0.9"/>
  <circle cx="256" cy="235" r="75" fill="url(#goldGrad)" opacity="0.95"/>
  <circle cx="256" cy="235" r="30" fill="none" stroke="#713f12" stroke-width="4"/>
  <!-- Point central (X) -->
  <path d="M 246 225 L 266 245 M 266 225 L 246 245" stroke="#713f12" stroke-width="5" stroke-linecap="round"/>

  <!-- Éclair / Flèche stylisée E-sport -->
  <path d="M 330 110 L 220 250 L 265 255 L 180 390 L 300 240 L 255 235 Z" fill="url(#boltGrad)" stroke="#f0f9ff" stroke-width="4"/>

  <!-- Badge AEL -->
  <rect x="136" y="405" width="240" height="62" rx="18" fill="#16223d" stroke="#38bdf8" stroke-width="4"/>
  <text x="256" y="449" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">AEL</text>
</svg>