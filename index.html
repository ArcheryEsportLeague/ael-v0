<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090f1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AEL">
  <title>Archery E-sport League (AEL) — V0.1</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">AEL</span>
      <span>V0.1 • Codex 12.0</span>
    </div>
    <div class="topbar-actions">
      <button id="btnTheme" class="btn-chip" type="button" aria-label="Changer de thème">☀️ Soleil</button>
      <button id="btnHome" class="btn-chip hidden" type="button" aria-label="Accueil">🏠</button>
    </div>
  </header>

  <main id="app" class="app-container" aria-live="polite">
    <div class="card center">Chargement d'Archery E-sport League...</div>
  </main>

  <div id="modalRoot" class="hidden"></div>

  <script src="moteur.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('AEL Service Worker actif :', reg.scope))
          .catch(err => console.error('Erreur Service Worker AEL :', err));
      });
    }
  </script>
</body>
</html>
